name: Yasmine
on:
  push:
  workflow_dispatch:
jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-test.txt
          pip install -e backend
      - name: Run unit, HTTP, and integration tests
        working-directory: backend
        run: python yasmineapp.py test

  frontend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run frontend unit tests
        run: node --test frontend/test/unit/*.test.js

  build-compose:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
    - uses: actions/checkout@v4
    - name: action-docker-compose
      uses: sudo-bot/action-docker-compose@latest
      with:
        cli-args: "build --no-cache"

  lint_python:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install pycodestyle
      - run: pycodestyle --max-line-length=120 backend/yasmine
