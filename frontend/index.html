<!DOCTYPE HTML>
<!-- 2026-09-27, version 4.4.0-beta: ASGSR, Alexey Emanov -->
<html lang="en">

<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <title>Yasmine</title>
    <link rel="icon" type="image/svg+xml" href="resources/images/favicon.svg">
    <link rel="apple-touch-icon" type="image/svg+xml" href="resources/images/favicon.svg">
    <script src="resources/js/yasmine-svg-icons.js?svg=23"></script>

    <style>
        html, body {
            margin: 0;
            min-height: 100%;
            background: #f4f7f9;
        }
        #yasmine-splash {
            position: fixed !important;
            top: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            left: 0 !important;
            z-index: 2147483647 !important;
            display: flex !important;
            align-items: center;
            justify-content: center;
            margin: 0;
            background: #f4f7f9 !important;
            color: #123b5d;
            font-family: Helvetica, Arial, sans-serif;
            transition: opacity 0.25s ease;
        }
        #yasmine-splash.yasmine-splash-hidden {
            opacity: 0;
            pointer-events: none;
        }
        .yasmine-splash-inner {
            text-align: center;
        }
        .yasmine-splash-logo {
            display: block;
            width: 96px;
            height: 96px;
            margin: 0 auto 16px;
            border-radius: 22px;
            box-shadow: 0 12px 30px rgba(18, 59, 93, 0.18);
        }
        .yasmine-splash-name {
            font-size: 32px;
            line-height: 1;
            font-weight: 600;
            letter-spacing: -0.5px;
        }
        .yasmine-splash-tag {
            margin-top: 8px;
            color: #607483;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        .yasmine-splash-version {
            margin-top: 6px;
            color: #607483;
            font-size: 13px;
            font-weight: 500;
        }
        .yasmine-splash-spinner {
            width: 28px;
            height: 28px;
            margin: 22px auto 0;
            border: 3px solid #ced9e0;
            border-top-color: #176f9f;
            border-radius: 50%;
            animation: yasmine-splash-spin 0.8s linear infinite;
        }
        @keyframes yasmine-splash-spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="yasmine-splash" aria-live="polite" aria-busy="true">
        <div class="yasmine-splash-inner">
            <img class="yasmine-splash-logo" src="resources/images/logo-mark.svg?brand=original-vector" alt="Yasmine">
            <div class="yasmine-splash-name">Yasmine</div>
            <div class="yasmine-splash-tag">StationXML Editor</div>
            <div class="yasmine-splash-version">4.4.0-beta</div>
            <div class="yasmine-splash-spinner" aria-hidden="true"></div>
        </div>
    </div>

    <script type="text/javascript">
        var Ext = Ext || {};

        var YASMINE_APP_ID = '725e6013-dc7c-4620-bf8c-64803da1f8ec';
        var YASMINE_SPLASH_RETRIES = 'yasmineSplashRetries';
        var YASMINE_SPLASH_RETRY_LIMIT = 12;
        var YASMINE_POLL_MS = 2000;
        var yasmineBootstrapLength = null;

        window.yasmineHideSplash = function () {
            var el = document.getElementById('yasmine-splash');
            try {
                sessionStorage.removeItem(YASMINE_SPLASH_RETRIES);
            } catch (ignore) {}
            if (!el || el.getAttribute('data-hidden')) {
                return;
            }
            el.setAttribute('data-hidden', '1');
            el.className += (el.className ? ' ' : '') + 'yasmine-splash-hidden';
            setTimeout(function () {
                if (el.parentNode) {
                    el.parentNode.removeChild(el);
                }
            }, 300);
        };

        function yasmineLoadScript(src, attrs, onload, onerror) {
            var script = document.createElement('script');
            script.src = src;
            script.async = false;
            if (attrs) {
                Object.keys(attrs).forEach(function (key) {
                    script.setAttribute(key, attrs[key]);
                });
            }
            if (onload) {
                script.onload = onload;
            }
            if (onerror) {
                script.onerror = onerror;
            }
            document.body.appendChild(script);
        }

        window.yasmineLeaflet = {
            js: 'leaflet.js',
            css: 'leaflet.css'
        };

        function yasmineSplashStillUp() {
            var el = document.getElementById('yasmine-splash');
            return !!(el && el.parentNode && !el.getAttribute('data-hidden'));
        }

        function yasmineRetryCount() {
            try {
                return parseInt(sessionStorage.getItem(YASMINE_SPLASH_RETRIES) || '0', 10) || 0;
            } catch (ignore) {
                return 0;
            }
        }

        function yasmineShowSplashFailure() {
            var tag = document.querySelector('.yasmine-splash-tag');
            var spinner = document.querySelector('.yasmine-splash-spinner');
            if (tag) {
                tag.textContent = 'Sencha build did not become ready.';
            }
            if (spinner) {
                spinner.style.display = 'none';
            }
        }

        function yasmineClearManifestCache() {
            var remove = [];
            var i;
            var key;
            try {
                for (i = 0; i < localStorage.length; i++) {
                    key = localStorage.key(i);
                    if (key && key.indexOf(YASMINE_APP_ID) !== -1) {
                        remove.push(key);
                    }
                }
                remove.forEach(function (storedKey) {
                    localStorage.removeItem(storedKey);
                });
            } catch (ignore) {}
        }

        function yasmineReloadAfterFailure() {
            var count;
            if (!yasmineSplashStillUp() || window._yasmineSplashReloading || window._yasminePollStopped) {
                return;
            }
            count = yasmineRetryCount();
            if (count >= YASMINE_SPLASH_RETRY_LIMIT) {
                window._yasminePollStopped = true;
                yasmineShowSplashFailure();
                return;
            }
            window._yasmineSplashReloading = true;
            try {
                sessionStorage.setItem(YASMINE_SPLASH_RETRIES, String(count + 1));
            } catch (ignore) {}
            yasmineClearManifestCache();
            location.reload();
        }

        function yasmineFetchText(url) {
            return fetch(url + (url.indexOf('?') >= 0 ? '&' : '?') + '_dc=' + Date.now(), {
                cache: 'no-store'
            }).then(function (response) {
                if (!response.ok) {
                    return '';
                }
                return response.text();
            });
        }

        function yasmineManifestReady(text) {
            var data;
            try {
                data = JSON.parse(text);
            } catch (ignore) {
                return false;
            }
            return !!(data && Array.isArray(data.js) && data.js.length && Array.isArray(data.css));
        }

        function yasmineStartApp() {
            if (window._yasmineAppStarted) {
                return;
            }
            window._yasmineAppStarted = true;
            yasmineClearManifestCache();
            yasmineLoadScript('bootstrap.js?_dc=' + Date.now(), {
                id: 'microloader',
                'data-app': YASMINE_APP_ID,
                type: 'text/javascript'
            }, null, yasmineReloadAfterFailure);
        }

        function yasminePollBootstrap() {
            if (window._yasmineAppStarted || window._yasminePollStopped) {
                return;
            }
            if (yasmineRetryCount() >= YASMINE_SPLASH_RETRY_LIMIT) {
                window._yasminePollStopped = true;
                yasmineShowSplashFailure();
                return;
            }
            yasmineFetchText('bootstrap.js').then(function (text) {
                var ready;
                var stable;
                if (window._yasmineAppStarted || window._yasminePollStopped) {
                    return;
                }
                ready = !!(text && text.indexOf('Ext.Microloader.run();') !== -1);
                stable = ready && yasmineBootstrapLength === text.length;
                yasmineBootstrapLength = ready ? text.length : null;
                if (!stable) {
                    setTimeout(yasminePollBootstrap, YASMINE_POLL_MS);
                    return;
                }
                return yasmineFetchText('classic.json').then(function (manifest) {
                    if (window._yasmineAppStarted || window._yasminePollStopped) {
                        return;
                    }
                    if (!yasmineManifestReady(manifest)) {
                        yasmineBootstrapLength = null;
                        setTimeout(yasminePollBootstrap, YASMINE_POLL_MS);
                        return;
                    }
                    yasmineStartApp();
                });
            }).catch(function () {
                yasmineBootstrapLength = null;
                if (!window._yasmineAppStarted && !window._yasminePollStopped) {
                    setTimeout(yasminePollBootstrap, YASMINE_POLL_MS);
                }
            });
        }

        window.addEventListener('error', function (event) {
            var target = event.target;
            var tag;
            if (!target || target === window) {
                return;
            }
            tag = target.tagName;
            if (tag === 'SCRIPT' || tag === 'LINK') {
                yasmineReloadAfterFailure();
            }
        }, true);

        function yasmineStartAfterPaint() {
            var started = false;
            var start = function () {
                if (started) {
                    return;
                }
                started = true;
                yasminePollBootstrap();
            };
            if (window.requestAnimationFrame) {
                requestAnimationFrame(function () {
                    requestAnimationFrame(function () {
                        setTimeout(start, 0);
                    });
                });
            }
            setTimeout(start, 80);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', yasmineStartAfterPaint);
        } else {
            yasmineStartAfterPaint();
        }

        Ext.beforeLoad = function (tags) {
            var s = location.search,
                profile,
                Boot = Ext.Boot,
                ua = navigator.userAgent || '',
                proto,
                needsSequential;

            needsSequential = (tags && (tags.safari || tags.ios || tags.chromeiOS)) ||
                /iPhone|iPad|iPod/.test(ua) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) ||
                (/Safari\//.test(ua) && !/Chrome\/|Chromium\/|Edg\//.test(ua));
            if (needsSequential && Boot && Boot.Entry) {
                proto = Boot.Entry.prototype;
                if (proto && !proto._yasmineSeqLoad && typeof proto.loadCrossDomain === 'function') {
                    proto._yasmineSeqLoad = true;
                    proto.load = function (sync) {
                        var me = this;
                        if (!me.loaded) {
                            if (me.loading) {
                                return false;
                            }
                            me.loading = true;
                            if (!sync) {
                                return me.loadCrossDomain();
                            }
                            me.loadSync();
                        }
                        return true;
                    };
                }
            }

            if (s.match(/\bclassic\b/)) {
                profile = 'classic';
            }
            else if (s.match(/\bmodern\b/)) {
                profile = 'modern';
            }
            else {
                profile = 'classic';
            }

            Ext.manifest = profile;
        };
    </script>

</body>
</html>
